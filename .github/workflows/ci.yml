name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "backend: ruff + mypy + pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy common processor simulator sink alerter api
      - run: uv run pytest -v

  integration:
    name: "backend: full stack integration (docker compose)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cp .env.example .env
      - run: uv sync --frozen
      # The tests start the Compose stack (3 brokers, TimescaleDB, processor, sink, alerter, API,
      # Prometheus) through testcontainers, produce known events, assert exact rows in TimescaleDB
      # and through the API/WebSocket, then tear the stack down with its volumes.
      - run: uv run pytest -m integration -v -s

  frontend:
    name: "frontend: types + lint + tests + build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  e2e:
    name: "frontend: Playwright smoke test on the live stack"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cp .env.example .env
      # The whole product: Kafka x3, TimescaleDB, 2 processors, sink, alerter, simulator, API,
      # Caddy + built frontend. The test then checks that real data is flowing into the UI.
      - run: docker compose up -d --build --wait
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm exec playwright test
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8081
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail=150
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    name: "images: build and push to GHCR"
    needs: [backend, integration, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: processor, file: Dockerfile, context: ., run_cmd: "python -m processor.main"}
          - {name: sink, file: Dockerfile, context: ., run_cmd: "python -m sink.main"}
          - {name: alerter, file: Dockerfile, context: ., run_cmd: "python -m alerter.main"}
          - {name: api, file: Dockerfile, context: ., run_cmd: "uvicorn api.main:app --host 0.0.0.0 --port 8080"}
          - {name: web, file: web/Dockerfile, context: ., run_cmd: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smart-parking-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RUN_CMD=${{ matrix.run_cmd }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: "deploy: SSH and compose up"
    needs: images
    # Runs only once a VM is configured (repository variable DEPLOY_ENABLED=true plus the secrets
    # DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY); see docs/DEPLOY.md.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull and restart on the VM
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ github.sha }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER_NAME@$HOST" \
            "cd /opt/smart-parking && git pull --ff-only && IMAGE_TAG=$TAG docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && IMAGE_TAG=$TAG docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans"
