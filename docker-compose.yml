x-kafka-broker: &kafka-broker
  image: apache/kafka:3.9.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  KAFKA_REPLICA_FETCH_MAX_BYTES: 16777216

x-app: &app
  build: .
  image: smart-parking:local
  env_file: .env
  restart: unless-stopped
  depends_on:
    init: {condition: service_completed_successfully}

services:
  kafka-1:
    <<: *kafka-broker
    container_name: kafka-1
    hostname: kafka-1
    ports: ["19092:19092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    volumes: [kafka-1-data:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka-broker
    container_name: kafka-2
    hostname: kafka-2
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
    volumes: [kafka-2-data:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka-broker
    container_name: kafka-3
    hostname: kafka-3
    ports: ["39092:39092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
    volumes: [kafka-3-data:/var/lib/kafka/data]

  init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
    volumes: ["./infra/create_topics.sh:/create_topics.sh:ro"]
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./infra/timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  processor:
    <<: *app
    command: ["python", "-m", "processor.main"]
    stop_grace_period: 30s
    deploy:
      replicas: 2  # two instances so a live rebalance can be shown; chaos scripts override this

  sink:
    <<: *app
    command: ["python", "-m", "sink.main"]
    depends_on:
      init: {condition: service_completed_successfully}
      timescaledb: {condition: service_healthy}
    stop_grace_period: 30s

  alerter:
    <<: *app
    command: ["python", "-m", "alerter.main"]
    stop_grace_period: 15s

  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    ports: ["8080:8080"]
    depends_on:
      init: {condition: service_completed_successfully}
      timescaledb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: smart-parking-web:local
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["8081:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 6

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka-1:9092
      - --kafka.server=kafka-2:9092
      - --kafka.server=kafka-3:9092
    depends_on:
      init: {condition: service_completed_successfully}

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [kafka-exporter]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  simulator:
    <<: *app
    command:
      - python
      - -m
      - simulator.main
      - --speed
      - ${SIM_SPEED:-20}
      - --start-local-hour
      - ${SIM_START_HOUR:-6}
      - --skip-weekend
      - --varied-sizes

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  timescale-data:
  prometheus-data:
  grafana-data:
